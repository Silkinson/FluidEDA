# Trunk dev server config.
# The COOP/COEP headers enable cross-origin isolation, which is REQUIRED for
# SharedArrayBuffer + wasm threads in Phase 2. We set them from day one so the
# worker split later needs no server changes.
[build]
target = "crates/app/index.html"
dist = "dist"

[serve]
address = "127.0.0.1"
port = 8080

[[serve.headers]]
name = "Cross-Origin-Opener-Policy"
value = "same-origin"

[[serve.headers]]
name = "Cross-Origin-Embedder-Policy"
value = "require-corp"
