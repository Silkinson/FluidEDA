# Trunk dev server config.
[build]
target = "crates/app/index.html"
dist = "dist"

# Build the parse worker (core-only wasm + wasm-bindgen glue) before the app, so
# copy-dir picks up assets/worker/. The worker runs the streaming parser off the
# main thread (Phase 2b STEP 2). It is a SEPARATE wasm module with its own memory
# — no shared heap, no atomics.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["scripts/build_worker.sh"]

[serve]
address = "127.0.0.1"
port = 8080

# Cross-origin isolation (required for SharedArrayBuffer + wasm threads in Phase 2).
# Trunk expects `headers` as a single map of name = value, not [[serve.headers]] tables.
[serve.headers]
"Cross-Origin-Opener-Policy" = "same-origin"
"Cross-Origin-Embedder-Policy" = "require-corp"

# Proxy the collaboration WebSocket to the relay (Phase 0 server on :9000), so the
# page and its socket share one origin. The app connects to ws://<host>/ws.
[[proxy]]
ws = true
backend = "ws://127.0.0.1:9000/ws"
