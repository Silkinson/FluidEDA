# Trunk dev server config.
[build]
target = "crates/app/index.html"
dist = "dist"

# Build the parse worker (core-only wasm + wasm-bindgen glue) before the app, so
# copy-dir picks up assets/worker/. The worker runs the streaming parser off the
# main thread (Phase 2b STEP 2). It is a SEPARATE wasm module with its own memory
# — no shared heap, no atomics.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["scripts/build_worker.sh"]

[serve]
address = "127.0.0.1"
port = 8080

# NOTE: no COOP/COEP headers. They were set for the abandoned shared-heap worker
# (they enable SharedArrayBuffer via cross-origin isolation). The shipped worker
# is a plain transferable-buffer worker, so cross-origin isolation is not needed —
# and dropping COEP:require-corp avoids its subresource CORP requirement.

# Proxy the collaboration server (:9000) so the page, its socket and the HTTP
# API share one origin. The app connects to ws://<host>/ws; Phase 6 adds the
# content-addressed blob store (/blobs/<sha256>) and room lookups (/rooms/<name>);
# SLICE 3 streams designs from server-built packs (/packs/<sha256>); Phase 7.4
# exports them with their edits (/export/<sha256>).
[[proxy]]
ws = true
backend = "ws://127.0.0.1:9000/ws"

[[proxy]]
backend = "http://127.0.0.1:9000/blobs"

[[proxy]]
backend = "http://127.0.0.1:9000/rooms"

[[proxy]]
backend = "http://127.0.0.1:9000/packs"

# Phase 7.4: server-side export of a streamed design with its edits.
[[proxy]]
backend = "http://127.0.0.1:9000/export"

# Phase 7.5: in-context DRC on the server (/drc/<sha256>).
[[proxy]]
backend = "http://127.0.0.1:9000/drc"
