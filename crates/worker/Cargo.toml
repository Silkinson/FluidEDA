[package]
name = "fluideda-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

# A cdylib so wasm-bindgen can wrap it as a Web Worker module. Depends on
# fluideda-core ONLY — no wgpu, no egui — so the worker wasm stays small and
# never touches the GPU/canvas (which don't exist in a worker context).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fluideda-core = { path = "../core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
