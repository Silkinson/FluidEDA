[package]
name = "fluideda-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fluideda-app"
path = "src/main.rs"

[dependencies]
fluideda-core = { path = "../core" }
fluideda-render = { path = "../render" }
fluideda-sync = { path = "../sync" }
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
glam.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlCanvasElement",
] }
