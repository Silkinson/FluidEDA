[package]
name = "fluideda-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "fluideda-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
log.workspace = true
env_logger = "0.11"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase 6: the server holds each room's document.
yrs.workspace = true
# Content addressing. 0.10 shares `digest` with tungstenite's sha1.
sha2 = "0.10"
# Phase 6 SLICE 3: the server parses stored designs into streamable packs.
fluideda-core = { path = "../crates/core" }
# Phase 7.4 SLICE C: exports read edits through the client's own overlay builder.
fluideda-sync = { path = "../crates/sync" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
glam.workspace = true
# Phase 7.1b: randomized convergence through a crashing room.
proptest = "1"
